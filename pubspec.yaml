name: prog_calc
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  petitparser: ^7.0.2
  auto_size_text: ^3.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SometypeMono
      fonts:
        - asset: assets/fonts/SometypeMono-Regular.ttf
        - asset: assets/fonts/SometypeMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/SometypeMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/SometypeMono-Italic.ttf
          style: italic
        - asset: assets/fonts/SometypeMono-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SometypeMono-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/SometypeMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SometypeMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
